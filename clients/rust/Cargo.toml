[package]
name = "fleet_gw_client"
version = "0.1.0"
edition = "2021"
description = "Fail-open Rust client shim for the Fleet Gateway with direct-vendor fallback"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[profile.release]
opt-level = 3
