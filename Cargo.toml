[package]
name = "fleet-gateway"
version = "0.1.0"
edition = "2021"
description = "API gateway with circuit breaker, key chain, and provider fallback for the fleet"

[lib]
name = "fleet_gateway"
path = "src/lib.rs"

[[bin]]
name = "fleet-gateway"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP server
axum = { version = "0.8", features = ["json", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Concurrent state
dashmap = "6"
# Memory
tikv-jemallocator = "0.6"
# Config
toml = "0.8"
# Error handling
thiserror = "2"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Async utilities
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# HTTP types
http = "1"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
